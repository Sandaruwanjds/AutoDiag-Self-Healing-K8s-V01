import numpy as np
from sklearn.ensemble import IsolationForest
import pandas as pd

class AnomalyDetector:
    def __init__(self):
        # Isolation Forest works well for anomaly detection
        # contamination=0.1 means "expect 10% of data to be anomalies"
        self.model = IsolationForest(
            contamination=0.1,
            random_state=42
        )
        self.is_trained = False

    def train(self, data):
        """
        data = list of dicts like:
        [{"cpu": 45, "memory": 60, "response_ms": 120}, ...]
        """
        df = pd.DataFrame(data)
        features = df[["cpu", "memory", "response_ms"]]
        self.model.fit(features)
        self.is_trained = True
        print("Model trained successfully!")

    def predict(self, cpu, memory, response_ms):
        """
        Returns: "normal" or "anomaly"
        """
        if not self.is_trained:
            return "model_not_trained"
        
        X = [[cpu, memory, response_ms]]
        result = self.model.predict(X)
        
        # IsolationForest returns -1 for anomaly, 1 for normal
        return "anomaly" if result[0] == -1 else "normal"

    def get_anomaly_score(self, cpu, memory, response_ms):
        """Higher score = more abnormal"""
        X = [[cpu, memory, response_ms]]
        score = self.model.decision_function(X)
        return float(score[0])


# ── Test the model ──────────────────────────────────────

    # Test with anomalous values

from openai import OpenAI
import os

client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))

def analyze_logs(log_text: str) -> dict:
    """
    Send logs to AI and get root cause explanation.
    
    Input:  raw log text from microservices
    Output: dict with root_cause, severity, recommendation
    """
    
    prompt = f"""
    You are an expert DevOps engineer analyzing microservice logs.
    
    Analyze the following system logs and identify:
    1. The ROOT CAUSE of any errors or failures
    2. The SEVERITY (critical / warning / info)
    3. RECOMMENDED action to fix it

        "severity": "critical|warning|info",
        "affected_service": "...",
        "recommendation": "..."
    }}
    
    LOGS TO ANALYZE:
    {log_text}
    """
    
    response = client.chat.completions.create(
        model="gpt-3.5-turbo",
        messages=[{"role": "user", "content": prompt}],
        response_format={"type": "json_object"}
    )

    return json.loads(response.choices[0].message.content)

def generate_test_data():
    """Create fake data with known anomalies"""
    normal = [

         "memory": random.uniform(30, 70),
         "response_ms": random.uniform(50, 300),
         "label": "normal"}
        for _ in range(900)
    ]
    anomalies = [
        {"cpu": random.uniform(85, 100),
         "memory": random.uniform(85, 100),
         "response_ms": random.uniform(3000, 10000),
         "label": "anomaly"}
        for _ in range(100)
    ]
    return normal + anomalies

# Train the model on 80% of data
detector = AnomalyDetector()
all_data = generate_test_data()
random.shuffle(all_data)

split = int(len(all_data) * 0.8)
train_data = all_data[:split]
test_data  = all_data[split:]

detector.train(train_data)

pred_labels = [
    detector.predict(d["cpu"], d["memory"], d["response_ms"])
